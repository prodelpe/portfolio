name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H prodelpe.com >> ~/.ssh/known_hosts

      - name: Pull latest main on the server
        run: |
          ssh -i ~/.ssh/deploy_key prodelpe@prodelpe.com \
            'cd /home/prodelpe/htdocs/prodelpe.com && git pull --ff-only origin main'
